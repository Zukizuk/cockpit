name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run package
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $zip = Get-ChildItem release/*.zip | Select-Object -First 1
          gh release create $env:GITHUB_REF_NAME $zip.FullName --title "Cockpit $($env:GITHUB_REF_NAME)" --notes "Download the zip, unzip it and double-click Install.cmd. What changed: see CHANGELOG.md."
