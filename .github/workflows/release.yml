name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    env:
      # a classic token of the Zukizuk account with public_repo: it opens winget's update pull request from the
      # Zukizuk/winget-pkgs fork. Without it, that step is skipped.
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Inno Setup (for Setup.exe)
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - run: npm run package
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $zip = Get-ChildItem release/*.zip | Select-Object -First 1
          $setup = Get-ChildItem release/Cockpit-Setup-*.exe | Select-Object -First 1
          if (-not $setup) { throw 'Setup.exe was not built' }
          gh release create $env:GITHUB_REF_NAME $zip.FullName $setup.FullName --title "Cockpit $($env:GITHUB_REF_NAME)" --notes "To install, download $($setup.Name) and run it (no admin rights needed; Windows may say it protected your PC: More info, then Run anyway). Or paste this in PowerShell: ``irm https://raw.githubusercontent.com/Zukizuk/cockpit/main/scripts/package/get.ps1 | iex``. What changed: see CHANGELOG.md."
      - name: winget (opens the pull request that updates Zukizuk.Cockpit)
        if: ${{ env.WINGET_TOKEN != '' }}
        continue-on-error: true
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: Zukizuk.Cockpit
          installers-regex: 'Cockpit-Setup-.*\.exe$'
          release-tag: ${{ github.ref_name }}
          fork-user: Zukizuk
          token: ${{ secrets.WINGET_TOKEN }}
